@if (userCardData) {
  <div class="d-flex align-items-center gap-2">
    <dsb-avatar-atom [imageUrl]="userCardData.avatarUrl" [name]="userCardData.userName" size="md"></dsb-avatar-atom>
    <div>
      <span class="fw-bold d-block">{{ userCardData.userName }}</span>
      <span class="text-muted d-block">{{ userCardData.userRole }}</span>
    </div>
  </div>
}
